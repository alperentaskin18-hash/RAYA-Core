name: MVP acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[images,voice]"
      - name: Verify installed REACTOR assets outside the checkout import path
        run: python -I -c "from importlib.resources import files; from raya.reactor.live_ui import Core; root=files('raya.reactor'); assert all(root.joinpath(n).is_file() for n in ('reference.png','reactor_art.png','reactor_clean.png')); assert Core().render(0).size == (348,348)"
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - run: python tests/voice_inference.py --reference-sample
      - run: python tools/verify_package.py
